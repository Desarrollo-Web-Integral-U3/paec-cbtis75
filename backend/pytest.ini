[pytest]
pythonpath = .
testpaths = app/tests
asyncio_default_fixture_loop_scope = function

# Variables de entorno para la suite de pruebas.
# - DATABASE_URL: SQLite en memoria, sin necesidad de Docker/PostgreSQL local.
# - DISABLE_RATE_LIMIT: apaga el limiter de slowapi para evitar 429 falsos
#   por el uso repetido de 127.0.0.1 desde el TestClient.
env =
    DATABASE_URL=sqlite:///:memory:
    DISABLE_RATE_LIMIT=1
