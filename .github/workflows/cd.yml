name: CD - Despliegue a producción

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Render/Railway ofrecen un "Deploy Hook": una URL que, al recibir un
      # POST, dispara un nuevo build+deploy del servicio. Se guarda como
      # secreto del repositorio (Settings > Secrets and variables > Actions).
      - name: Disparar deploy en Render (backend)
        run: curl -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4
      - name: Disparar deploy en Render/Vercel (frontend)
        run: curl -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
