# Configuracion de nginx para servir el bundle estatico del frontend.
# Sustituye al default de la imagen nginx:alpine.
#
# Aspectos que cubre:
#   1. Headers de seguridad (issue #41) -> anti-clickjacking + hardening.
#   2. SPA routing -> cualquier ruta desconocida cae en /index.html para
#      que react-router-dom resuelva el path en el cliente.
#
# GOTCHA importante de nginx: si un bloque `location` define cualquier
# `add_header`, nginx DESCARTA todos los `add_header` heredados del
# `server` padre. Por eso los headers de seguridad viven en `server` y
# ningun `location` agrega headers propios: para preservar la herencia
# y garantizar que TODAS las respuestas lleven la CSP y X-Frame-Options.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # Headers de seguridad (issue #41 - PAEC / OWASP)
    # ------------------------------------------------------------------
    # X-Frame-Options: DENY -> impide que la app sea embebida en un
    # <iframe> desde cualquier origen. Deprecated en favor de CSP
    # frame-ancestors, pero aun util para defensa en profundidad
    # (navegadores antiguos que no implementan bien la CSP).
    add_header X-Frame-Options "DENY" always;

    # Content-Security-Policy con frame-ancestors 'none' -> reemplazo
    # moderno y estandar de X-Frame-Options. Ningun sitio (ni el mismo
    # origen) puede embeber la app dentro de un iframe. Anti-clickjacking.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # X-Content-Type-Options: nosniff -> bloquea el MIME sniffing del
    # navegador. Evita que un recurso servido con un Content-Type
    # incorrecto sea interpretado como script.
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer-Policy: no-referrer -> no filtra la URL de origen a
    # recursos externos. Minimiza fugas de informacion de navegacion.
    add_header Referrer-Policy "no-referrer" always;

    # ------------------------------------------------------------------
    # SPA routing: intenta el archivo, luego el directorio, luego cae en
    # index.html para que React Router resuelva la ruta en cliente.
    # NO se define ningun add_header aqui para no romper la herencia de
    # los headers de seguridad definidos arriba en el server.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
